<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödemenizi Tamamlayın</title>
  <style>
    body {
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .header {
      border-bottom: 2px solid #007bff; /* Mavi tonu */
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    h1 {
      color: #007bff; /* Mavi tonu */
      font-size: 28px;
      margin: 0;
    }
    .details {
      background-color: #e9f5ff; /* Açık mavi tonu */
      padding: 20px;
      border-radius: 8px;
      margin: 25px 0;
      text-align: left;
    }
    .detail-row {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .detail-label {
      font-weight: bold;
      color: #555;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #007bff; /* Mavi tonu */
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #0056b3; /* Koyu mavi tonu */
    }
    .footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Ödemenizi Tamamlayın</h1>
  </div>

  <p>Merhaba <span th:text="${customerName}"></span>,</p>
  <p>**<span th:text="${serviceName}"></span>** hizmeti için ödeme işleminizi tamamlamanız gerekiyor. Ödemeyi tamamlamak için lütfen aşağıdaki butona tıklayın:</p>

  <div class="details">
    <div class="detail-row">
      <span class="detail-label">Ödenecek Tutar:</span>
      <span th:text="${amount}"></span>
    </div>
  </div>

  <a class="button" th:href="@{${paymentLink}}">Ödemeyi Tamamla</a>

  <div class="footer">
    <p>Herhangi bir sorunuz varsa, lütfen bizimle iletişime geçin.</p>
    <p>© <span th:text="${currentYear}">2025</span> Personal Trainer App. Tüm hakları saklıdır.</p>
  </div>
</div>
</body>
</html>
